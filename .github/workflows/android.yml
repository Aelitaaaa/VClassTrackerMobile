name: Android checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Tests, lint, and both APK builds
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache --max-workers=1 clean test lintDebug lintRelease assembleDebug assembleRelease
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vclass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: vclass-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
